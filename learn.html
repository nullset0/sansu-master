<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← ホーム</a>

      <div class="sub">問題を解く前の1分で、頭に「道具」を入れる</div>
    </div>
  </div>

</div>

</nav>

<script src="app/fig.js?v=78"></script>
<script src="app/chara.js?v=78"></script>
<script src="app/store.js?v=78"></script>
<script src="app/quiz.js?v=78"></script>
<script src="data/core.js?v=78"></script>
<script src="questions/g1.js?v=78"></script>
<script src="questions/g2.js?v=78"></script>
<script src="questions/g3.js?v=78"></script>
<script src="questions/g4.js?v=78"></script>
<script src="questions/g5.js?v=78"></script>
<script src="questions/g6.js?v=78"></script>
<script src="data/elem.js?v=78"></script>
<script src="data/jk-num.js?v=78"></script>
<script src="data/jk-ratio.js?v=78"></script>
<script src="data/jk-toku.js?v=78"></script>
<script src="data/jk-speed.js?v=78"></script>
<script src="data/jk-geo.js?v=78"></script>
<script src="data/jk-calc.js?v=78"></script>
<script src="data/jk-speed2.js?v=78"></script>
<script src="data/jk-geo2.js?v=78"></script>
<script src="data/jk-num2.js?v=78"></script>
<script src="data/jk-drill.js?v=78"></script>
<script src="data/hard.js?v=78"></script>
<script src="data/graph.js?v=78"></script>
<script src="app/modes.js?v=78"></script>
<script src="app/mastery.js?v=78"></script>
<script>
(() => {
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const rich = Quiz.rich;
  const withTeach = DATA.units.filter(u => u.teach);
  const areas = [...new Set(withTeach.map(u => u.area))]
    .map(id => ({ id, ...DATA.AREAS[id] }))
    .sort((a,b) => a.order - b.order);

  let filter = 'all';
  const fbox = document.getElementById('filter');
  const chips = [{id:'all', name:'ぜんぶ', emoji:'✨'}].concat(areas);
  fbox.innerHTML = chips.map(a =>
    `<button data-a="${a.id}" class="${a.id==='all'?'on':''}">${a.emoji||''} ${a.name}</button>`).join('');

  function card(u) {
    const t = u.teach, qs = DATA.byUnit(u.id);
    const s = Store.unitStats(u.id, qs.map(q=>q.id));
    return `<div class="pat" id="${u.id}">
      <h2>${u.emoji} ${esc(u.name)}
        <span style="margin-left:auto;font-size:.7rem;font-weight:800;color:var(--sub)">${Math.round(s.mastery*100)}% 定着</span></h2>
      <div class="tagline">${esc(u.tag||'')}</div>
      <div class="keyline"><span class="lab">かんじんな一言</span>${rich(t.key)}</div>
      ${(t.formulas||[]).map(f => `<span class="formula${f.includes('：')||f.includes('例')?' alt':''}">${esc(f)}</span>`).join('')}
      ${t.fig ? Fig.render(t.fig) : ''}
      ${t.steps ? `<h3>手順</h3><div class="steps">${t.steps.map(s=>`<div class="step">${rich(s)}</div>`).join('')}</div>` : ''}
      ${t.trap ? `<div class="note d"><strong>⚠️ よくあるミス：</strong>${rich(t.trap)}</div>` : ''}
      ${t.extra ? `<div class="note b">${rich(t.extra)}</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px">
        <a class="btn sm blue" href="train.html?unit=${encodeURIComponent(u.id)}">▶︎ この単元を解く（${qs.length}問）</a>
        <button class="btn sm ghost" data-read="${u.id}">🔊 読んでもらう</button>
      </div>
    </div>`;
  }

  function render() {
    const list = withTeach.filter(u => filter==='all' || u.area===filter);
    document.getElementById('list').innerHTML = list.length
      ? areas.filter(a => filter==='all' || a.id===filter).map(a => {
          const us = list.filter(u => u.area===a.id);
          if (!us.length) return '';
          return `<h2 style="margin:20px 6px 10px;font-size:1rem">${a.emoji} ${a.name}</h2>` + us.map(card).join('');
        }).join('')
      : '<div class="card"><p class="muted">この分野の解き方カードは これから追加されます。</p></div>';

    document.querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', () => {
      const u = DATA.unit(b.dataset.read);
      Quiz.speak(`${u.name}。${u.teach.key} ${(u.teach.formulas||[]).join('。')}`);
    }));
    const hash = location.hash.slice(1);
    if (hash && document.getElementById(hash)) {
      document.getElementById(hash).scrollIntoView({behavior:'smooth', block:'start'});
    }
  }

  fbox.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    fbox.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); filter = b.dataset.a; SFX.tap(); render();
  }));

  // URLハッシュで単元指定されていたら、そのエリアに絞る
  const hash = location.hash.slice(1);
  if (hash) {
    const u = DATA.unit(hash);
    if (u && u.teach) {
      filter = u.area;
      fbox.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.a===u.area));
    }
  }
  render();
})();
</script>
</body>
</html>

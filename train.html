<script src="app/fig.js?v=81"></script>
<script src="app/chara.js?v=81"></script>

<script src="data/core.js?v=81"></script>

<script src="questions/g6.js?v=81"></script>

<script src="data/jk-num.js?v=81"></script>
<script src="data/jk-ratio.js?v=81"></script>
<script src="data/jk-toku.js?v=81"></script>
<script src="data/jk-speed.js?v=81"></script>
<script src="data/jk-geo.js?v=81"></script>
<script src="data/jk-calc.js?v=81"></script>
<script src="data/jk-speed2.js?v=81"></script>
<script src="data/jk-geo2.js?v=81"></script>
<script src="data/jk-num2.js?v=81"></script>
<script src="data/jk-drill.js?v=81"></script>
<script src="data/hard.js?v=81"></script>
<script src="data/graph.js?v=81"></script>

<script src="app/goal.js?v=81"></script>
<script src="app/notice.js?v=81"></script>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  const host = document.getElementById('app');
  const st = Store.state;
  const unitId = P.get('unit'), areaId = P.get('area');
  const mode = P.get('mode') || 'plan';
  const count = Number(P.get('n')) || Store.get('dailyGoal') || 5;
  const setHead = (t, sub) => {
    document.getElementById('t-title').textContent = t;
    document.getElementById('t-sub').textContent = sub || '';
  };

  /* ---------- レベル診断：下の学年から3問ずつ ---------- */
  if (mode === 'placement') {
    setHead('🎈 レベル診断', 'できる学年は とばして先へ進みます');
    let gi = 0;
    const passed = [];
    const step = () => {
      if (gi >= Mastery.GRADES.length) return finishPlacement();
      const g = Mastery.GRADES[gi];
      const qs = Mastery.ladderFor(g, 3).map(q => Quiz.normalize(q));
      if (!qs.length) { gi++; return step(); }
      const name = (DATA.AREAS[g] || {}).name || g;
      host.innerHTML = `<div class="card" style="text-align:center">
        ${Chara.tag('fukurou','normal', `つぎは <b>${name}</b> の問題を3問。ぜんぶ合っていたら とばして先へ進むよ。`, 92, {html:true})}
        <button class="btn wide blue" id="go" style="margin-top:8px">▶︎ ${name}の3問へ</button></div>`;
      document.getElementById('go').onclick = () => {
        Quiz.start({ pool: qs, list: qs, host, count: qs.length, noFinishUI: true,
          onDone: ({ok, total}) => {
            if (ok === total) { Mastery.assumeGrade(g); passed.push(name); gi++; step(); }
            else finishPlacement(name);
          }});
      };
    };
    const finishPlacement = (stopAt) => {
      st.placed = st.placed || (passed.length ? Mastery.GRADES[passed.length-1] : 'g1');
      Store.save();
      const fr = Mastery.frontier(3);
      host.innerHTML = `<div class="card" style="text-align:center">
        <h2 style="justify-content:center">🎈 診断おわり！</h2>
        <div style="display:flex;justify-content:center">${Chara.svg('fukurou','excited',140,{anim:'hop'})}</div>
        <p class="muted">${passed.length ? `<b>${passed.join('・')}</b> はもう分かっているとみなしました。` : 'まずは1年生の内容からゆっくりいこう。'}
        ${stopAt ? `<br><b>${stopAt}</b> のあたりから ていねいにやっていくよ。` : ''}</p>
        <div class="note b" style="text-align:left">ここからは学年のかべはありません。前の単元がしっかりしたら、
          <b>知らないうちに上の学年へ</b>進んでいきます。つまずいたら自動で下へ戻します。</div>
      </div>
      ${fr.length ? `<div class="card"><h2>📍 まずはここから</h2>
        ${fr.map(f=>`<a class="unit" style="display:flex;gap:10px;align-items:center;margin-bottom:8px" href="train.html?unit=${encodeURIComponent(f.u.id)}">
          <span style="font-size:1.3rem">${f.u.emoji}</span><span style="flex:1"><span class="t">${f.u.name}</span>
          <span class="m">${(DATA.AREAS[f.u.area]||{}).name||''}</span></span><span style="color:var(--a);font-weight:800">▶︎</span></a>`).join('')}
      </div>` : ''}
      <div class="card"><a class="btn wide blue" href="sokutei.html">🔍 もっとくわしく測る（1学年6問）</a>
        <a class="btn wide" href="index.html" style="margin-top:8px">🏠 ホームへ</a></div>`;
      Quiz.confetti(1.4); SFX.clear();
    };
    step();
    return;
  }

  /* ---------- なぜ？チェック（本質が分かっているか） ----------
     答えが合うだけでは「済」にしない。何算かを見ぬけるか・手順を組み立て
     られるかを、その単元だけで問う。7割とれたら合格。何度でも受けられる。
  ------------------------------------------------------------ */
  if (mode === 'why') {
    const uid = P.get('unit') || Mastery.explainDue(1)[0];
    const u = uid && DATA.unit(uid);
    if (!u) {
      setHead('🧠 なぜ？チェック', '');
      host.innerHTML = '<div class="card"><p class="muted">いまチェックできる単元はありません。単元を仕上げると出てきます。</p>'
        + '<a class="btn wide" href="index.html">🏠 ホームへ</a></div>';
      return;
    }
    setHead('🧠 なぜ？チェック', `${u.name} — 答えは出さなくていい`);
    const hasSteps = DATA.byUnit(uid).filter(q => q.steps && q.steps.length >= 3 && q.steps.length <= 5).length >= 2;
    const nPat = hasSteps ? 3 : 4;

    const intro = () => {
      host.innerHTML = `<div class="card" style="text-align:center">
        ${Chara.tag('fukurou','normal',
          `<b>${u.name}</b> は もう解けるようになったね。<br>つぎは <b>「なぜそれで解けるのか」</b> を見せてもらうよ。`, 100, {html:true})}
        <div class="note b" style="text-align:left">問題を見て <b>何算か</b> を当てる${nPat}問${hasSteps?'と、<b>解く順番</b>をならべかえる2問':''}。
          計算はしなくていい。7割できたら合格で、この単元が「済」になります。</div>
        <button class="btn wide blue" id="go" style="margin-top:8px">▶︎ はじめる</button>
        <a class="btn wide ghost" href="index.html" style="margin-top:8px">あとで</a>
      </div>`;
      document.getElementById('go').onclick = run;
    };

    const run = () => {
      Modes.patternPick(host, { n: nPat, unit: uid, onDone: r1 => {
        if (!hasSteps) return done(r1.ok, r1.total);
        Modes.stepOrder(host, { n: 2, unit: uid,
          onDone: r2 => done(r1.ok + r2.ok, r1.total + r2.total) });
      }});
    };

    const done = (ok, total) => {
      const pass = Mastery.recordExplain(uid, ok, total);
      const s = Mastery.unitState(uid);
      Store.touchStreak();
      if (pass) { Quiz.confetti(1.4); SFX.clear(); }
      host.innerHTML = `
      <div class="card" style="text-align:center">
        <h2 style="justify-content:center">${pass ? '🧠 合格！' : '🧠 もう一歩'}</h2>
        <div style="display:flex;justify-content:center">${Chara.svg('fukurou', pass?'excited':'thinking', 130, pass?{anim:'hop'}:{})}</div>
        <div style="font-size:2.2rem;font-weight:900">${ok} <span style="font-size:1rem;color:var(--sub)">/ ${total}問</span></div>
        <p class="muted">${pass
          ? `<b>${u.name}</b> は「解ける」だけでなく「なぜ」も言えています。済にしました。`
          : `答えは出せていても、<b>どの道具を使うか</b>がまだあいまいです。解き方を見てから、もう一度どうぞ。`}</p>
      </div>
      <div class="card">
        ${pass ? '' : `<a class="btn wide blue" href="train.html?mode=why&unit=${encodeURIComponent(uid)}">🔁 もう1回</a>`}
        <a class="btn wide ${pass?'blue':'ghost'}" href="learn.html#${encodeURIComponent(uid)}" style="margin-top:8px">📖 ${u.name}の解き方</a>
        <a class="btn wide ghost" href="index.html" style="margin-top:8px">🏠 ホームへ</a>
      </div>`;
    };
    intro();
    return;
  }

  /* ---------- 紙の代わりの練習モード ---------- */
  if (mode === 'time')    { setHead('⏱ タイムアタック', '計算のスピードをきたえる');   Modes.timeAttack(host, {n:Number(P.get('n'))||20}); return; }
  if (mode === 'pattern') { setHead('🔧 道具えらび', '何算かを見ぬく');                 Modes.patternPick(host, {n:Number(P.get('n'))||8}); return; }
  if (mode === 'steps')   { setHead('🪜 手順ならべかえ', '解く順を組み立てる');         Modes.stepOrder(host, {n:Number(P.get('n'))||5}); return; }

  /* ---------- ときどきチェック ---------- */
  if (mode === 'check') {
    const list = Mastery.buildCheck(Number(P.get('n')) || 10).map(q => Quiz.normalize(q));
    setHead('🩺 チェック', 'ヒント無し・解説はさいご');
    if (list.length < 3) {
      host.innerHTML = '<div class="card"><p class="muted">チェックできる単元がまだ足りません。まずは何単元かクリアしよう。</p>'
        + '<a class="btn wide ghost" href="index.html">ホームへ</a></div>';
      return;
    }
    Quiz.start({ pool: list, list, host, count: list.length, mode: 'check' });
    return;
  }

  /* ---------- 単元 / エリア / まちがい / きょうのプラン ---------- */
  let pool = [], title = '', sub = '', only = null, list = null;

  if (unitId) {
    const u = DATA.unit(unitId);
    if (!u) { host.innerHTML = '<div class="card">単元が見つかりません。</div>'; return; }
    pool = DATA.byUnit(unitId);
    setHead(`${u.emoji} ${u.name}`, u.tag || '');
    document.getElementById('t-learn').href = `learn.html#${unitId}`;
    const s = Mastery.unitState(unitId);
    if (!s.open) {
      const need = Graph.pre(unitId).map(p => (DATA.unit(p)||{}).name).join('・');
      host.innerHTML = `<div class="card">
        ${Chara.tag('fukurou','thinking', `この単元はまだ早いかも。先に <b>${need}</b> をかためると、ここが ぐっと楽になるよ。`, 96, {html:true})}
        ${Graph.pre(unitId).map(p=>{const pu=DATA.unit(p); return pu?`<a class="btn ghost wide sm" style="margin-top:8px" href="train.html?unit=${encodeURIComponent(p)}">${pu.emoji} ${pu.name} をやる</a>`:''}).join('')}
        <button class="btn wide" id="anyway" style="margin-top:12px">それでも やってみる</button></div>`;
      document.getElementById('anyway').onclick = () => go();
      return;
    }
    if (u.teach && !s.started) {
      host.innerHTML = `<div class="card">
          ${Chara.tag('fukurou','thinking', `${u.name} は はじめてだね。先に「解き方」を1分だけ見ておくと、ぐっと楽になるよ。`, 96)}
          <div class="note"><strong>${u.emoji} ${u.name}</strong><br>${u.tag||''}</div>
          <div style="background:linear-gradient(180deg,#fff8e6,#fff1cf);border:2.5px dashed var(--e);border-radius:16px;padding:13px 15px;font-weight:800;margin:12px 0">
            <span style="font-size:.7rem;color:#a06b00;display:block;margin-bottom:3px">かんじんな一言</span>${u.teach.key}</div>
          <a class="btn wide blue" href="learn.html#${unitId}">📖 解き方を見る</a>
          <button class="btn ghost wide" id="skip" style="margin-top:10px">いきなり やってみる</button>
        </div>`;
      document.getElementById('skip').onclick = () => go();
      return;
    }
  } else if (areaId) {
    pool = DATA.qsOfArea(areaId);
    const a = DATA.AREAS[areaId] || {};
    setHead(`${a.emoji||''} ${a.name||areaId}`, '');
  } else if (mode === 'wrong') {
    pool = DATA.all(); only = 'wrong';
    setHead('🔁 まちがいノート', '一度まちがえた問題だけ');
  } else {
    list = Mastery.plan(count);
    pool = list;
    setHead('🎯 きょうの' + count + '問', 'ふくしゅう・土台なおし・新しい所を まぜて出します');
  }

  function go() { Quiz.start({ pool, list, count, host, unitId, only }); }
  go();
})();
</script>

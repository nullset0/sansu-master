<script>
/* =========================================================
   くわしく測る（sokutei）
   レベル診断は「各学年3問・1問でも落ちたら打ち切り」なので、
   うっかりミス1つでも下に振れる。ここでは打ち切り学年の前後を
   1学年6問ずつ出し、学年ごとの正答率で本当の位置を測る。
   ========================================================= */
(() => {
  const P    = new URLSearchParams(location.search);
  const host = document.getElementById('app');
  const GR   = ['g1','g2','g3','g4','g5','g6'];
  const N    = Number(P.get('n')) || 6;   // 1学年あたりの出題数
  const MAXG = Number(P.get('g')) || 4;   // 測る学年数の上限
  const nameOf = g => (DATA.AREAS[g] || {}).name || g;

  // 開始学年：診断の結果（placed）の1つ下から。診断していなければ1年生から
  const placed = P.get('from') || Store.state.placed || 'g1';
  const pi = Math.max(0, GR.indexOf(placed) - 1);

  /* --- その学年から、単元をまんべんなく散らして n 問えらぶ --- */
  function pick(grade, n) {
    const buckets = Store.shuffle(DATA.byArea(grade))
      .map(u => Store.shuffle(DATA.byUnit(u.id).filter(q => (q.lv || 1) <= 3)))
      .filter(b => b.length);
    const out = [];
    for (let r = 0; out.length < n && r < 40; r++)
      for (const b of buckets) { if (out.length >= n) break; if (b.length) out.push(b.pop()); }
    return out.map(q => Quiz.normalize(q));
  }

  const runGrade = (qs) => new Promise(res => {
    document.body.classList.add('measuring');
    Quiz.start({ pool: qs, list: qs, host, count: qs.length, noFinishUI: true, onDone: res });
  });

  const log = [];   // [{grade, ok, total, results}]

  function intro(g, done) {
    const left = MAXG - log.length;
    host.innerHTML = `<div class="card" style="text-align:center">
      ${Chara.tag('fukurou','normal',
        `つぎは <b>${nameOf(g)}</b> の問題を ${N}問。<br>ヒントは無しで、いまの力をそのまま測るよ。`, 92, {html:true})}
      <p class="muted" style="font-size:.8rem">これまで ${log.length}学年ぶん・のこり最大 ${left}学年</p>
      <button class="btn wide blue" id="go" style="margin-top:8px">▶︎ ${nameOf(g)}の${N}問へ</button>
      <a class="btn wide ghost" id="stop" style="margin-top:8px" href="#">ここでやめて結果を見る</a>
    </div>`;
    document.getElementById('go').onclick = done;
    document.getElementById('stop').onclick = e => { e.preventDefault(); finish(); };
  }

  async function step(i) {
    if (i >= GR.length || log.length >= MAXG) return finish();
    const g  = GR[i];
    const qs = pick(g, N);
    if (!qs.length) return step(i + 1);
    await new Promise(r => intro(g, r));
    const r = await runGrade(qs);
    log.push({ grade: g, ok: r.ok, total: r.total, results: r.results || [] });
    document.body.classList.remove('measuring');

    // 判定：5/6以上=OK→上へ / 3〜4=あやしい→1学年だけ確かめて止める / 2以下=ここが壁→止める
    const rate = r.ok / r.total;
    if (rate >= 0.8) return step(i + 1);
    if (rate <= 0.4) return finish();
    return log.length < 2 ? step(i + 1) : finish();
  }

  /* --- 結果 --- */
  function finish() {
    document.body.classList.remove('measuring');
    if (!log.length) { host.innerHTML = '<div class="card"><p class="muted">まだ測っていません。</p>'
      + '<a class="btn wide" href="index.html">ホームへ</a></div>'; return; }

    const cls = r => r >= 0.8 ? 'sk-ok' : r >= 0.6 ? 'sk-mid' : 'sk-ng';
    const rows = log.map(l => {
      const r = l.ok / l.total;
      return `<tr><td>${nameOf(l.grade)}</td>
        <td class="s ${cls(r)}">${l.ok} / ${l.total}</td>
        <td class="s ${cls(r)}">${Math.round(r*100)}%</td></tr>`;
    }).join('');

    // できている上限＝80%以上の一番上／取り組みどころ＝最初に80%を切った学年
    const solid = [...log].reverse().find(l => l.ok / l.total >= 0.8);
    const weak  = log.find(l => l.ok / l.total < 0.8);

    // まちがえた問題を単元ごとにまとめる
    const miss = {};
    log.forEach(l => l.results.filter(x => !x.ok).forEach(x => {
      const u = DATA.unit(x.unit); const k = x.unit;
      (miss[k] || (miss[k] = { name: (u && u.name) || k, area: (u && u.area) || l.grade, n: 0 })).n++;
    }));
    const missList = Object.values(miss).sort((a,b) => b.n - a.n);

    /* ---- 測るだけで終わらせない：結果を毎日の出題に効かせる ----
       ① 8割そろった学年は「だいたい分かっている」として土台を上げる（上げるだけ）
       ② そこで落とした単元には「あやしい」印をつける。学年は飛ばしても、
          落とした単元だけは毎日の弱点枠（Mastery.plan の②）で必ず戻ってくる     */
    const applied = { skipped: [], marked: [] };
    const missSet = new Set(Object.keys(miss));
    const placedBefore = Store.state.placed || 'g1';
    log.filter(l => l.ok / l.total >= 0.8).forEach(l => {
      Mastery.assumeGrade(l.grade, missSet); applied.skipped.push(nameOf(l.grade));
    });
    const U = Store.state.units;
    Object.entries(miss).forEach(([id, m]) => {
      const e = U[id] || (U[id] = { seen:0, ok:0 });
      // shaky（チェックで落とした回数＝格下げの根拠）ではなく focus を立てる。
      // shaky に足すと、次のチェックで1問落としただけで格下げが走る＝下へ押し戻しすぎる。
      // focus は毎日の弱点枠で優先されるだけの印で、その単元が「済」になったら自動で下りる。
      e.focus = 1;
      applied.marked.push(m.name);
    });
    // 開始地点の記録は上へ伸びたときだけ更新する。
    // ★ assumeGrade は最後に placed = その学年 を書くので、下の学年を測り直しただけで
    //   placed が下がってしまう。ここで測る前の値と比べて、高いほうを残す。
    const best = solid ? solid.grade : placedBefore;
    Store.state.placed = GR.indexOf(best) > GR.indexOf(placedBefore) ? best : placedBefore;
    Store.save();

    const payload = {
      date: Store.today(), from: placed, n: N,
      grades: log.map(l => ({ g: l.grade, name: nameOf(l.grade), ok: l.ok, total: l.total })),
      solid: solid ? solid.grade : null,
      weak: weak ? weak.grade : null,
      miss: missList.map(m => ({ unit: m.name, area: (DATA.AREAS[m.area]||{}).name || m.area, n: m.n })),
    };
    try { localStorage.setItem('sokutei:last', JSON.stringify(payload)); } catch (e) {}

    host.innerHTML = `
    <div class="card" style="text-align:center">
      <h2 style="justify-content:center">🔍 くわしく測りおわり！</h2>
      <div style="display:flex;justify-content:center">${Chara.svg('fukurou','excited',130,{anim:'hop'})}</div>
      <p class="muted">よくがんばりました。おうちの人にこの画面を見せてね。</p>
    </div>

    <div class="card"><h2>📊 学年ごとの正答率</h2>
      <table class="sk-grid"><tr><th>学年</th><th style="text-align:right">正解</th><th style="text-align:right">率</th></tr>${rows}</table>
      <div class="note b" style="text-align:left;margin-top:10px">
        <b>いまの力：</b>${solid ? `${nameOf(solid.grade)}の内容は 8割以上できています。` : 'まだ8割そろった学年がありません。'}<br>
        <b>取り組みどころ：</b>${weak ? `${nameOf(weak.grade)}（${weak.ok}/${weak.total}）` : 'この範囲では見つかりませんでした。もう1学年上も測れます。'}
      </div>
    </div>

    ${missList.length ? `<div class="card"><h2>🧱 まちがえた単元</h2>
      ${missList.map(m => `<div class="unit" style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
        <span style="flex:1"><span class="t">${m.name}</span><span class="m">${(DATA.AREAS[m.area]||{}).name||''}</span></span>
        <span style="color:var(--a);font-weight:800">${m.n}問</span></div>`).join('')}
    </div>` : ''}

    <div class="card"><h2>🔗 毎日の出題に反映しました</h2>
      <div class="note b" style="text-align:left">
        ${applied.skipped.length ? `<b>${applied.skipped.join('・')}</b> は「だいたい分かっている」として先へ進みます。<br>` : ''}
        ${applied.marked.length ? `落とした <b>${applied.marked.join('・')}</b> は<b>重点</b>に入れました。学年を飛ばしても、この単元だけは毎日の出題で戻ってきます（できるようになったら自動で外れます）。`
          : '落とした単元はありませんでした。'}
      </div>
      <a class="btn wide green" href="train.html?mode=daily" style="margin-top:8px">✏️ さっそく きょうの5問へ</a>
    </div>

    <div class="card"><h2>📋 結果のコピー（保護者むけ）</h2>
      <p class="muted" style="font-size:.8rem">下のボタンでコピーして、そのまま貼りつけて共有できます。</p>
      <textarea class="sk-code" id="code" readonly>${JSON.stringify(payload)}</textarea>
      <button class="btn wide" id="cp" style="margin-top:8px">📋 コピーする</button>
    </div>

    <div class="card">
      <a class="btn wide blue" href="sokutei.html?from=${GR[Math.min(GR.length-1, GR.indexOf(log[log.length-1].grade)+1)]}">🔁 もう1学年ぶん測る</a>
      <a class="btn wide ghost" href="index.html" style="margin-top:8px">🏠 ホームへ</a>
    </div>`;

    document.getElementById('cp').onclick = async () => {
      const t = document.getElementById('code');
      try { await navigator.clipboard.writeText(t.value); Quiz.toast('コピーしました'); }
      catch (e) { t.select(); document.execCommand('copy'); Quiz.toast('コピーしました'); }
    };
    Quiz.confetti(1.2); SFX.clear();
  }

  /* --- はじめの画面 --- */
  host.innerHTML = `<div class="card" style="text-align:center">
    ${Chara.tag('fukurou','normal',
      `いまの力を <b>くわしく</b> 測ります。<br>1学年 ${N}問ずつ、ヒント無しで解いてね。`, 100, {html:true})}
    <div class="note b" style="text-align:left">
      レベル診断は3問なので、うっかりミス1つでも低く出ます。ここでは
      <b>${nameOf(GR[pi])}</b> のあたりから ${N}問ずつ出して、できている学年と つまずいている学年を分けます。
      できていれば上の学年へ、むずかしければそこで終わります（最大${MAXG}学年）。
    </div>
    <button class="btn wide blue" id="begin" style="margin-top:8px">▶︎ はじめる</button>
    <a class="btn wide ghost" href="index.html" style="margin-top:8px">やめる</a>
  </div>`;
  document.getElementById('begin').onclick = () => step(pi);
})();
</script>

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 日本語ファイル名(.html)を扱うため
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML は毎回確認させる。Cache-Control を付けていないとブラウザが
    # 独自の判断でキャッシュしてしまい、版を打った新しいHTMLが届かない
    # ＝古いJSのURLを読みつづける（白画面が端末に残った原因のひとつ）。
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        etag on;
    }

    # Service Worker は キャッシュしない（更新を確実に反映）
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Manifest
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header Content-Type application/manifest+json;
    }

    # 静的アセット
    location ~* \.(png|svg|jpg|jpeg|gif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    # JS/CSS は1日キャッシュしていた。これだと直したのに反映されず、
    # Service Worker の cache.add まで古いファイルを掴む（実際に「きょうの5問」の
    # 白画面が、直した後も端末に残りつづける状態になっていた）。
    # ファイル名にハッシュを付けていないので、毎回 ETag で確認させる。
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        etag on;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # セキュリティヘッダ
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ログ
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
